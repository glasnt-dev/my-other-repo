name: custard-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Find the packages that were changed
  affected:
    uses: glasnt/trifle/.github/workflows/affected.yaml@debugging-matchPackages
    permissions:
      statuses: write
    with:
      head-sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      config-file: .github/config.jsonc


  lint:
    needs: affected
    uses: glasnt/trifle/.github/workflows/run-command.yaml@debugging-matchPackages
    with:
      command: lint
      paths: ${{ needs.affected.outputs.paths }}

  test:
    needs: affected
    uses: glasnt/trifle/.github/workflows/run-command.yaml@debugging-matchPackages
    with:
      command: test
      paths: ${{ needs.affected.outputs.paths }}

  # example: always run tests
  always-test:
    needs: affected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: glasnt/trifle/actions/steps/map-run@debugging-matchPackages
        with:
          command: pwd && ls
          paths: ${{ needs.affected.outputs.paths }}

  # Confirm all checks complete
  done:
    needs: [affected, test, lint]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: glasnt/trifle/actions/steps/update-check@v0.0.10
        with:
          check: ${{ needs.affected.outputs.check }}
          status: success
