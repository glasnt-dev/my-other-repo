name: custard-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  affected:
    uses: glasnt/trifle/.github/workflows/affected.yaml@v0.1.0
    permissions:
      statuses: write
    with:
      head-sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      config-file: .github/config.jsonc

  lint:
    needs: affected
    uses: glasnt/trifle/.github/workflows/run-command.yaml@v0.1.0
    with:
      command: lint
      paths: ${{ needs.affected.outputs.paths }}

  test:
    needs: affected
    uses: glasnt/trifle/.github/workflows/run-command.yaml@v0.1.0
    with:
      command: test
      paths: ${{ needs.affected.outputs.paths }}

  # Confirm all checks complete
  done:
    needs: [affected, test, lint]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: glasnt/trifle/actions/steps/update-check@v0.0.10
        with:
          check: ${{ needs.affected.outputs.check }}
          status: success
